[package]
name = "markshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Render reference-style screenshot annotations for AI coding agents"
readme = "README.md"
keywords = ["screenshot", "annotation", "reference", "cli", "ai-agents"]
publish = false

[lib]
name = "markshot"
path = "src/lib.rs"

[[bin]]
name = "markshot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libm = "0.2.16"
png = "0.18.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
sha2 = "0.11.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
