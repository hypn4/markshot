[package]
name = "markshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Render deterministic screenshot annotations for AI coding agents"
repository = "https://github.com/hypn4/markshot"
license = "MIT"
readme = "README.md"
keywords = ["screenshot", "annotation", "png", "cli", "ai-agents"]
publish = false

[lib]
name = "markshot"
path = "src/lib.rs"

[[bin]]
name = "markshot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libm = "0.2.16"
png = "0.18.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["no-std-float"] }
ttf-parser = "0.25.1"

[dev-dependencies]
assert_cmd = "2.2.2"
sha2 = "0.11.1"

# `cargo binstall` downloads the release binaries instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/markshot-{ target }{ binary-ext }"
pkg-fmt = "bin"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
