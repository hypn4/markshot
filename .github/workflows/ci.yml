name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md: repository text uses no em dash (U+2014) and no middle dot (U+00B7).
      - name: Check punctuation
        shell: bash
        run: |
          # UTF-8 bytes in octal, so the check also runs in bash 3.2 and never matches itself.
          if git grep -nI -e "$(printf '\342\200\224')" -e "$(printf '\302\267')"; then
            echo "::error::Replace the em dashes and middle dots listed above (see AGENTS.md)."
            exit 1
          fi
      - name: Lint the shell install script
        run: shellcheck -s sh scripts/install.sh
      - name: Lint the PowerShell install script
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning, Error
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
      # Installs the toolchain and components pinned in rust-toolchain.toml, with a dependency cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Every platform runs the whole suite natively, so the golden PNGs and the determinism probe
  # prove that each one draws the same bytes.
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # An explicit --target also fails the job if a runner's architecture isn't the expected one.
      - run: cargo test --locked --target "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
      # The install script for this platform picks its asset by the release's naming, checks it
      # against SHA256SUMS and installs it; a local directory holding the binary just tested
      # stands in for the release.
      - name: Install script
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in *windows*) exe=.exe ;; *) exe= ;; esac
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          cp "target/$TARGET/debug/markshot$exe" "$release/markshot-$TARGET$exe"
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          (cd "$release" && "${sum[@]}" -- * > SHA256SUMS)
          export MARKSHOT_INSTALL_DIR="$RUNNER_TEMP/bin"
          case "$TARGET" in
            *windows*)
              MARKSHOT_DOWNLOAD_URL="$(cygpath -w "$release")" pwsh -NoProfile -File scripts/install.ps1
              ;;
            *)
              MARKSHOT_DOWNLOAD_URL="file://$release" sh scripts/install.sh
              ;;
          esac
          "$MARKSHOT_INSTALL_DIR/markshot$exe" --version
