name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md: repository text uses no em dash (U+2014) and no middle dot (U+00B7).
      - name: Check punctuation
        shell: bash
        run: |
          # UTF-8 bytes in octal, so the check also runs in bash 3.2 and never matches itself.
          if git grep -nI -e "$(printf '\342\200\224')" -e "$(printf '\302\267')"; then
            echo "::error::Replace the em dashes and middle dots listed above (see AGENTS.md)."
            exit 1
          fi
      # Installs the toolchain and components pinned in rust-toolchain.toml, with a dependency cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Every platform runs the whole suite natively, so the golden PNGs and the determinism probe
  # prove that each one draws the same bytes.
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # An explicit --target also fails the job if a runner's architecture isn't the expected one.
      - run: cargo test --locked --target "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
